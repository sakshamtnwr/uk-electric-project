services:
  backend:
    build:
      context: ./backend
    environment:
      FRONTEND_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      ELEXON_TIMEOUT_SECONDS: "20"
      ANALYSIS_CACHE_TTL_SECONDS: "900"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8000"
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
